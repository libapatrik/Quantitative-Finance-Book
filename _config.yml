title: Quantitative Finance Book
author: Patrik Liba
copyright: "2025"
logo: logo.jpeg

execute:
  execute_notebooks: cache  # Use cached outputs when available, execute when changed
  allow_errors: false  # Fail the build if there are errors (better for CI/CD)
  timeout: 600  # Increased timeout for complex notebooks
  stderr_output: show  # Show error messages for debugging

latex:
  latex_documents:
    targetname: QFB.tex

bibtex_bibfiles:
  - references.bib

repository:
  url: https://github.com/libapatrik/Quantitative-Finance-Book
  branch: master

html:
  use_issues_button: true
  use_repository_button: true

parse:
  myst_enable_extensions:
    - dollarmath
    - amsmath

exclude_patterns:
  - .venv
  - _build
  - "**.ipynb_checkpoints"

sphinx:
  extra_extensions:
    - sphinxcontrib.bibtex
  config:
    bibtex_reference_style: author_year