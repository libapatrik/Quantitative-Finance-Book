name: Build and Deploy Jupyter Book

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libboost-all-dev build-essential python3-dev libtbb-dev libomp-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pybind11 scikit-build wheel setuptools
          pip install -r requirements.txt

      - name: Normalize notebook kernels to python3
        run: |
          python -c "
          import json, glob
          for path in glob.glob('**/*.ipynb', recursive=True):
              if '_build' in path or '.venv' in path:
                  continue
              with open(path) as f:
                  nb = json.load(f)
              ks = nb.get('metadata', {}).get('kernelspec', {})
              if ks.get('name') != 'python3':
                  ks['name'] = 'python3'
                  ks['display_name'] = 'Python 3 (ipykernel)'
                  nb['metadata']['kernelspec'] = ks
                  with open(path, 'w') as f:
                      json.dump(nb, f, indent=1, ensure_ascii=False)
                      f.write('\n')
                  print(f'Fixed kernel: {path}')
          "

      - name: Build the book
        run: |
          jupyter-book build .

      - name: Show build output
        run: |
          echo "Working directory:"
          pwd
          echo "Build output:"
          ls -la _build || true
          ls -la _build/html || true

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4